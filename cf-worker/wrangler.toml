name = "yugioh-image-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Cho phép tất cả origin (*) hoặc liệt kê các domain được phép phân tách bằng dấu phẩy
